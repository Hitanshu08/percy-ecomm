name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Create .env file
        working-directory: frontend
        run: |
          cat <<EOF > .env
          VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          VITE_ENVIRONMENT=${{ secrets.VITE_ENVIRONMENT }}
          VITE_DEBUG=${{ secrets.VITE_DEBUG }}
          VITE_TELEGRAM_URL=${{ secrets.VITE_TELEGRAM_URL }}
          VITE_USD_TO_CREDITS_RATE=${{ secrets.VITE_USD_TO_CREDITS_RATE }}
          EOF

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Deploy to server via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 153.92.11.8
          port: 21
          username: u959214930
          password: ${{ secrets.FRONTEND_SERVER_PASSWORD }}
          local-dir: frontend/dist/
          server-dir: /domains/valuesubs.com/public_html/
