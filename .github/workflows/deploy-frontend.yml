name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Create .env file
        working-directory: frontend
        run: |
          cat <<EOF > .env
          VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          VITE_ENVIRONMENT=${{ secrets.VITE_ENVIRONMENT }}
          VITE_DEBUG=${{ secrets.VITE_DEBUG }}
          VITE_TELEGRAM_URL=${{ secrets.VITE_TELEGRAM_URL }}
          VITE_USD_TO_CREDITS_RATE=${{ secrets.VITE_USD_TO_CREDITS_RATE }}
          EOF

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Deploy via backend server relay
        uses: appleboy/ssh-action@v1
        with:
          host: 5.199.166.87
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            apt-get install -y sshpass || true
            cd /tmp
            rm -rf _fe_deploy
            mkdir -p _fe_deploy

      - name: Upload dist to backend server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 5.199.166.87
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          source: frontend/dist/*
          target: /tmp/_fe_deploy/
          strip_components: 2

      - name: Relay to frontend server
        uses: appleboy/ssh-action@v1
        with:
          host: 5.199.166.87
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 5m
          script: |
            sshpass -p '${{ secrets.FRONTEND_SERVER_PASSWORD }}' \
              scp -P 65002 -o StrictHostKeyChecking=no -r \
              /tmp/_fe_deploy/* \
              u959214930@153.92.11.8:/home/u959214930/domains/valuesubs.com/public_html/
            rm -rf /tmp/_fe_deploy
